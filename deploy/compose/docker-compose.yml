# v1 data services (ARCHITECTURE.md section 8.1). Postgres is bound to 127.0.0.1 only, so
# it is never reachable from outside this machine. The password comes from a
# git-ignored .env file (see .env.example); it is never committed.
name: rootcause

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rootcause}
      POSTGRES_DB: ${POSTGRES_DB:-rootcause}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/compose/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rootcause} -d ${POSTGRES_DB:-rootcause}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
