# RootCause's Application (ARCHITECTURE.md section 14): Argo CD syncs deploy/k8s from
# main into the cluster. Automated sync with prune (what leaves git leaves
# the cluster) and self-heal (a change made by hand is reverted).
# scripts/k8s-up.sh applies it; with --dev it turns automated sync off
# instead, and scripts/k8s-gitops-prove.sh fails while it is off.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rootcause
  namespace: argocd
spec:
  project: rootcause
  source:
    repoURL: git@github.com:DIZAMU/RootCause.git
    targetRevision: main
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    # Every manifest names its own namespace; the project checks this default.
    namespace: rootcause-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
