# Everything in the cluster except the rootcause-db Secret and the
# api-to-apiserver NetworkPolicy, which scripts/k8s-up.sh creates (the first
# holds the generated password, the second the API server's address).
# k3d.yaml is the cluster itself, not a resource.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - rbac.yaml
  - sandboxes.yaml
  - system-network.yaml
  - postgres.yaml
  - api.yaml
  - dbt.yaml
