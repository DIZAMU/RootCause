# Everything Argo CD syncs from main into the cluster (spec sections 8.2 and
# 14). Not in here, because scripts/k8s-up.sh creates them: the namespaces
# (namespaces.yaml; Argo CD may not create cluster-wide objects), the
# rootcause-db and ghcr-pull Secrets (they hold secrets) and the
# api-to-apiserver NetworkPolicy (it holds the API server's address).
# k3d.yaml is the cluster itself, not a resource.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - admission.yaml
  - rbac.yaml
  - sandboxes.yaml
  - system-network.yaml
  - postgres.yaml
  - api.yaml
  - dbt.yaml
# The release the cluster runs, by digest only. release.yml prints the digest
# of each vX.Y.Z it pushes; the owner puts it here in a pull request, and
# ci.yml checks that it is a pushed release. The zero digest means no release
# has been deployed yet: scripts/k8s-up.sh then needs --dev.
images:
  - name: rootcause/api
    newName: ghcr.io/dizamu/rootcause-api
    digest: fdc3c9a0cf40a9af93d3770c1d9c650826312e6d659d3b2873426fea0180837f
