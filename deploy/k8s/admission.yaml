# Admission rules for every pod in the sandboxes namespace (spec section 13.2).
# The runtime builds sandbox pods this way already (internal/runtime/kubernetes,
# podFor); this policy makes the API server refuse any pod that is not built
# this way, whoever asks: the API, Argo CD or an administrator. There are no
# matchConditions, so no requester is exempt. Pod Security Admission baseline
# stays on as well: it covers procMount, sysctls, AppArmor, SELinux options and
# host ports, which this policy does not repeat.
#
# Rules a to l, each with its own message; the API server reports the first
# rule a pod breaks, so the more specific rules come first. Container rules
# apply to containers, init containers and ephemeral containers alike.
# TestSandboxAdmission checks them. Some breaks never reach this policy:
# API validation refuses host namespaces with hostUsers false, and Pod
# Security Admission refuses privileged containers, hostPath volumes, extra
# capabilities outside its baseline and unconfined seccomp first. Rules b,
# c and d still stand behind them: the comment on each rule names the layer
# that refuses it today. Pod Security stays on (ADR 0012).
# Each container rule is written three times, once per container list.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: rootcause-sandbox-pods
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: sandboxes
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers]
  variables:
    - name: initContainers
      expression: "has(object.spec.initContainers) ? object.spec.initContainers : []"
    - name: ephemeralContainers
      expression: "has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : []"
    - name: podSeccompDefault
      expression: "has(object.spec.securityContext) && has(object.spec.securityContext.seccompProfile) && object.spec.securityContext.seccompProfile.type == 'RuntimeDefault'"
  validations:
    # a: refused by this policy.
    - expression: 'has(object.spec.hostUsers) && object.spec.hostUsers == false'
      message: 'rootcause: a sandbox pod must set hostUsers to false (its own user namespace)'
    # b: a backstop. API validation refuses host namespaces with hostUsers false first, and rule a refuses hostUsers true.
    - expression: '!(has(object.spec.hostNetwork) && object.spec.hostNetwork) && !(has(object.spec.hostPID) && object.spec.hostPID) && !(has(object.spec.hostIPC) && object.spec.hostIPC)'
      message: 'rootcause: a sandbox pod may not use the host network, PID or IPC namespace'
    # i: refused by this policy.
    - expression: 'has(object.spec.automountServiceAccountToken) && object.spec.automountServiceAccountToken == false'
      message: 'rootcause: a sandbox pod must set automountServiceAccountToken to false'
    # c: a backstop. Pod Security baseline refuses hostPath first.
    - expression: '!has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.hostPath))'
      message: 'rootcause: a sandbox pod may not mount a hostPath volume'
    # l: refused by this policy (secret, configMap, projected and PVC volumes).
    - expression: '!has(object.spec.volumes) || object.spec.volumes.all(v, has(v.emptyDir))'
      message: 'rootcause: a sandbox pod may use only emptyDir volumes'
    # d: a backstop. Pod Security baseline refuses privileged first, and API validation refuses privileged with allowPrivilegeEscalation false.
    - expression: 'object.spec.containers.all(c, !(has(c.securityContext) && has(c.securityContext.privileged) && c.securityContext.privileged))'
      message: 'rootcause: no container in a sandbox pod may be privileged'
    # d
    - expression: 'variables.initContainers.all(c, !(has(c.securityContext) && has(c.securityContext.privileged) && c.securityContext.privileged))'
      message: 'rootcause: no container in a sandbox pod may be privileged'
    # d
    - expression: 'variables.ephemeralContainers.all(c, !(has(c.securityContext) && has(c.securityContext.privileged) && c.securityContext.privileged))'
      message: 'rootcause: no container in a sandbox pod may be privileged'
    # e: refused by this policy.
    - expression: 'object.spec.containers.all(c, has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation) && c.securityContext.allowPrivilegeEscalation == false)'
      message: 'rootcause: every container must set allowPrivilegeEscalation to false'
    # e
    - expression: 'variables.initContainers.all(c, has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation) && c.securityContext.allowPrivilegeEscalation == false)'
      message: 'rootcause: every container must set allowPrivilegeEscalation to false'
    # e
    - expression: 'variables.ephemeralContainers.all(c, has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation) && c.securityContext.allowPrivilegeEscalation == false)'
      message: 'rootcause: every container must set allowPrivilegeEscalation to false'
    # f: refused by this policy.
    - expression: 'object.spec.containers.all(c, has(c.securityContext) && has(c.securityContext.capabilities) && has(c.securityContext.capabilities.drop) && ''ALL'' in c.securityContext.capabilities.drop)'
      message: 'rootcause: every container must drop ALL capabilities'
    # f
    - expression: 'variables.initContainers.all(c, has(c.securityContext) && has(c.securityContext.capabilities) && has(c.securityContext.capabilities.drop) && ''ALL'' in c.securityContext.capabilities.drop)'
      message: 'rootcause: every container must drop ALL capabilities'
    # f
    - expression: 'variables.ephemeralContainers.all(c, has(c.securityContext) && has(c.securityContext.capabilities) && has(c.securityContext.capabilities.drop) && ''ALL'' in c.securityContext.capabilities.drop)'
      message: 'rootcause: every container must drop ALL capabilities'
    # g: Pod Security baseline refuses capabilities outside its own list (SYS_ADMIN) first; this policy refuses those in that list but not in the allowlist (MKNOD).
    - expression: 'object.spec.containers.all(c, !(has(c.securityContext) && has(c.securityContext.capabilities) && has(c.securityContext.capabilities.add)) || c.securityContext.capabilities.add.all(x, x in [''CHOWN'', ''DAC_OVERRIDE'', ''FOWNER'', ''FSETID'', ''KILL'', ''SETGID'', ''SETUID'', ''NET_BIND_SERVICE'']))'
      message: 'rootcause: a container may add back only CHOWN, DAC_OVERRIDE, FOWNER, FSETID, KILL, SETGID, SETUID and NET_BIND_SERVICE'
    # g
    - expression: 'variables.initContainers.all(c, !(has(c.securityContext) && has(c.securityContext.capabilities) && has(c.securityContext.capabilities.add)) || c.securityContext.capabilities.add.all(x, x in [''CHOWN'', ''DAC_OVERRIDE'', ''FOWNER'', ''FSETID'', ''KILL'', ''SETGID'', ''SETUID'', ''NET_BIND_SERVICE'']))'
      message: 'rootcause: a container may add back only CHOWN, DAC_OVERRIDE, FOWNER, FSETID, KILL, SETGID, SETUID and NET_BIND_SERVICE'
    # g
    - expression: 'variables.ephemeralContainers.all(c, !(has(c.securityContext) && has(c.securityContext.capabilities) && has(c.securityContext.capabilities.add)) || c.securityContext.capabilities.add.all(x, x in [''CHOWN'', ''DAC_OVERRIDE'', ''FOWNER'', ''FSETID'', ''KILL'', ''SETGID'', ''SETUID'', ''NET_BIND_SERVICE'']))'
      message: 'rootcause: a container may add back only CHOWN, DAC_OVERRIDE, FOWNER, FSETID, KILL, SETGID, SETUID and NET_BIND_SERVICE'
    # h: Pod Security baseline refuses Unconfined first; this policy refuses Localhost profiles and a missing profile.
    - expression: 'object.spec.containers.all(c, (has(c.securityContext) && has(c.securityContext.seccompProfile)) ? c.securityContext.seccompProfile.type == ''RuntimeDefault'' : variables.podSeccompDefault)'
      message: 'rootcause: every container must run with the RuntimeDefault seccomp profile'
    # h
    - expression: 'variables.initContainers.all(c, (has(c.securityContext) && has(c.securityContext.seccompProfile)) ? c.securityContext.seccompProfile.type == ''RuntimeDefault'' : variables.podSeccompDefault)'
      message: 'rootcause: every container must run with the RuntimeDefault seccomp profile'
    # h
    - expression: 'variables.ephemeralContainers.all(c, (has(c.securityContext) && has(c.securityContext.seccompProfile)) ? c.securityContext.seccompProfile.type == ''RuntimeDefault'' : variables.podSeccompDefault)'
      message: 'rootcause: every container must run with the RuntimeDefault seccomp profile'
    # j: refused by this policy.
    - expression: 'object.spec.containers.all(c, has(c.imagePullPolicy) && c.imagePullPolicy == ''Never'')'
      message: 'rootcause: every container must use imagePullPolicy Never; sandbox images are imported, never pulled'
    # j
    - expression: 'variables.initContainers.all(c, has(c.imagePullPolicy) && c.imagePullPolicy == ''Never'')'
      message: 'rootcause: every container must use imagePullPolicy Never; sandbox images are imported, never pulled'
    # j
    - expression: 'variables.ephemeralContainers.all(c, has(c.imagePullPolicy) && c.imagePullPolicy == ''Never'')'
      message: 'rootcause: every container must use imagePullPolicy Never; sandbox images are imported, never pulled'
    # k: refused by this policy.
    - expression: 'object.spec.containers.all(c, c.image.startsWith(''rootcause/''))'
      message: 'rootcause: every container image must be a rootcause/ exercise image'
    # k
    - expression: 'variables.initContainers.all(c, c.image.startsWith(''rootcause/''))'
      message: 'rootcause: every container image must be a rootcause/ exercise image'
    # k
    - expression: 'variables.ephemeralContainers.all(c, c.image.startsWith(''rootcause/''))'
      message: 'rootcause: every container image must be a rootcause/ exercise image'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: rootcause-sandbox-pods
spec:
  policyName: rootcause-sandbox-pods
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: sandboxes
