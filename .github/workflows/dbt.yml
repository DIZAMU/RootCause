# dbt build against a Postgres service container with seed data (spec
# section 14). The seed data is TestScriptedSelection's series of sessions,
# played through the real engine; the dbt package tests add a killed-engine
# recovery and a failed build that keeps its log.
#
# The dbt container reaches the service container over the job's docker
# network by its service name, set through RC_DBT_NETWORK and RC_DBT_HOST
# (tests and CI only; the engine itself uses the compose Postgres).
#
# The workflow always runs and checks the changed paths itself, so it can
# become a required check (see exercises.yml).
name: dbt

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: dbt-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: dbt
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rootcause
          POSTGRES_DB: rootcause_test
          # A throwaway database that lives only for this job.
          POSTGRES_PASSWORD: ci-only-throwaway
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U rootcause -d rootcause_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: did the dbt project or its inputs change?
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          case "$EVENT" in
            workflow_dispatch) run=true ;;
            pull_request) range="$PR_BASE $PR_HEAD" ;;
            *) if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = 0000000000000000000000000000000000000000 ]; then run=true; else range="$PUSH_BEFORE $PUSH_AFTER"; fi ;;
          esac
          if [ -z "${run:-}" ]; then
            # shellcheck disable=SC2086 # two commits, split on purpose
            if git diff --name-only $range | grep -qE '^(dbt/|internal/dbt/|internal/store/migrations/|internal/selector/|internal/testenv/|\.github/workflows/dbt\.yml$)'; then
              run=true
            else
              run=false
            fi
          fi
          echo "run dbt: $run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.changed.outputs.run == 'true'
        with:
          go-version-file: go.mod
      - name: dbt build with seed data (fails on any skip)
        if: steps.changed.outputs.run == 'true'
        env:
          RC_TEST_DATABASE_URL: postgres://rootcause:ci-only-throwaway@127.0.0.1:5432/rootcause_test?sslmode=disable
          RC_DBT_NETWORK: ${{ job.services.postgres.network }}
          RC_DBT_HOST: postgres
          RC_REQUIRE_DOCKER: "1"
        run: >-
          scripts/ci-go-test.sh
          --require TestScriptedSelection
          --require TestBuildRecoversFromKilledEngine
          --require TestBuildFailureKeepsLog
          ./internal/dbt/ ./internal/selector/
