  too_open: "Backupskriptet eller /srv/backup kan nå endres av alle brukere."
  backup_fails: "Backupen feiler fortsatt når den kjører som brukeren backup."
  no_archive: "Backupen kjørte, men det kom ikke noe nytt arkiv eid av backup i /srv/backup."
