id: perm-02-backup-denied
version: 1
topic: permissions
difficulty: 2
estimated_minutes: 15
network: none
resources:
  memory: 128Mi
  cpus: 0.5
session_ttl_minutes: 60
check:
  runs_from: sandbox
  before: none
# What a real root needs to repair the backup: DAC_OVERRIDE and FOWNER to change
# files it does not own, CHOWN to change owners. SETUID and SETGID let the check
# run the backup as the backup user.
capabilities: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
variants:
  dataset: [regnskap, kunder, lager]
