ticket:
  title: "The meter app stopped saving"
  from: "Jonas Vik, Facilities"
  body: |
    Hi. Maleapp has not saved a single meter reading since last night. The
    meters keep sending, but nothing new shows up. Its data lives in
    /srv/data and its log is in /var/log/maleapp/. Please do not delete our
    reference files, the app needs them.
hints:
  - "Read the app's log, then look at how full the data volume is."
  - "df -h shows free space per file system. du -sh shows how much a folder holds, and ls -la also shows hidden names that start with a dot."
  - "{junk} takes about {junk_mb} MB. Find out what it is and remove it."
walkthrough: |
  The log says "No space left on device". The app cannot write because the
  volume is full. df -h /srv/data confirms it shows 100% used.

  Find what takes the space. du -sh /srv/data/* misses hidden folders,
  because * skips names that start with a dot. Use du -sh /srv/data/.[!.]*
  /srv/data/* or ls -la, or search for big files.
    find /srv/data -type f -size +10M
  Here {junk} was a leftover export of about {junk_mb} MB.

  Delete the leftover and run df -h again. The app saves again, and the
  reference files in /srv/data/reference stay untouched.

  Wiping the whole volume would also free space, but it would destroy data
  the app needs. Find the cause first, then remove only that.
feedback:
  data_missing: "Reference files the app needs are missing or changed."
  still_full: "The data volume still has too little free space."
  app_cannot_save: "Maleapp still cannot save a reading."
